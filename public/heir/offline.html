<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Katekize is offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11161c; color: #f1ece3; font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; text-align: center; }
  main { max-width: 22em; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { margin: 0; font: 600 26px/1.2 Georgia, 'Times New Roman', serif; }
  p { margin: 0; color: #a3acb6; }
  button { font: 600 16px system-ui, sans-serif; background: #f1ece3; color: #11161c; border: 0; border-radius: 999px; padding: 13px 26px; min-height: 48px; }
</style>
</head>
<body>
<main>
  <img src="/heir/icon-192.png" width="88" height="88" alt="">
  <h1>You’re offline</h1>
  <p>Katekize needs a connection to open. Reconnect and try again. Your progress is saved.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
