<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catechism path</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5D50}a:hover{color:#234A3F}
button{font:inherit}
@keyframes hdrift{from{transform:scale(1.05) translate3d(-2%,0,0)}to{transform:scale(1.12) translate3d(2%,-1.5%,0)}}
.h-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:hdrift 70s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.h-bg{animation:none}}
.h-glass{background:rgba(250,249,246,.82);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px) saturate(1.1)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, system-ui, sans-serif; color: #1F2421; background: #8C9AA0">
  <img class="h-bg" src="/_blob/f0e34ab78cd573929237cd80a02d7b70" alt="" style="object-position: 30% center">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,24,28,.15), rgba(20,24,28,0) 40%)"></div>
  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 52px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Memorize.dc.html" aria-label="Back" class="h-glass" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1F2421"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-weight: 800; font-size: 15px; color: #FFFFFF; text-shadow: 0 1px 6px rgba(0,0,0,.35)">Westminster Shorter Catechism</span>
    </div>
    <div class="h-glass" style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #55605A">Part 1 · Questions 1–38</span>
      <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; line-height: 1.2">What we are to believe concerning God</span>
    </div>

    <div style="position: relative; flex: 1">
      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="10">
        <div style="{{n.wrap}}">
          <a href="{{n.href}}" aria-label="{{n.aria}}" style="{{n.circle}}">{{n.num}}</a>
          <span style="{{n.labelStyle}}">{{n.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { car: '#B9431F', top: '#D9A441', sap: '#2F5B9A', eme: '#2E9A6E' };
    const q = [
      [1, 'Chief end of man', 'eme'], [2, 'The rule to glorify him', 'sap'], [3, 'What Scripture teaches', 'sap'], [4, 'What is God?', 'top'],
      [5, 'One God', 'car'], [6, 'Three persons', 'now'], [7, 'God’s decrees', null], [8, 'How God executes them', null], [9, 'Creation', null], [10, 'Man created', null]
    ];
    const xs = [150, 220, 250, 210, 130, 70, 60, 120, 200, 245];
    return {
      nodes: q.map(([num, label, s], i) => {
        const top = 6 + (9 - i) * 56;
        const now = s === 'now', done = s && !now;
        const size = now ? 64 : 50;
        const circle = 'width: ' + size + 'px; height: ' + size + 'px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 800; font-size: ' + (now ? 22 : 17) + 'px; flex: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); ' +
          (now ? 'background: #2F5D50; color: #F7F4EC; border: 4px solid #F7F4EC' : done ? 'background: ' + C[s] + '; color: #FFFFFF; border: 3px solid rgba(255,255,255,.85)' : 'background: rgba(250,249,246,.82); color: #55605A; border: 2px dashed #B9B2A2');
        return {
          num, label: now ? 'Q6 · ' + label + ' · Start' : label, href: now ? 'WordBank.dc.html' : '#', aria: 'Question ' + num + ': ' + label,
          wrap: 'position: absolute; top: ' + top + 'px; display: flex; align-items: center; gap: 8px; ' + (xs[i] > 195 ? 'flex-direction: row-reverse; right: ' + (358 - xs[i] - size / 2) + 'px' : 'left: ' + (xs[i] - size / 2) + 'px'),
          circle,
          labelStyle: 'font-size: 13px; font-weight: 800; padding: 5px 10px; border-radius: 12px; white-space: nowrap; ' + (now ? 'background: #F7F4EC; color: #1E4A3E' : 'background: rgba(250,249,246,.78); color: #1F2421')
        };
      })
    };
  }
}
</script>
</body>
</html>
