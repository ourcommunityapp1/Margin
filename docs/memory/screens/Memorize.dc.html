<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memorize library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5D50}a:hover{color:#234A3F}
button{font:inherit}
@keyframes hdrift{from{transform:scale(1.05) translate3d(-2%,0,0)}to{transform:scale(1.12) translate3d(2%,-1.5%,0)}}
.h-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:hdrift 70s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.h-bg{animation:none}}
.h-glass{background:rgba(250,249,246,.82);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px) saturate(1.1)}
.h-tab{height:52px;border-radius:20px;text-decoration:none;color:#3A433E;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.h-tab.on{background:#2F5D50;color:#F7F4EC}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, system-ui, sans-serif; color: #1F2421; background: #7FA3C8">
  <img class="h-bg" src="/_blob/0b692594b50bb3d355c178e6771c8427" alt="">
  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 16px 100px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 40px; color: #FFFFFF; text-shadow: 0 1px 10px rgba(0,0,0,.25)">Memorize</h1>
    <div class="h-glass" style="border-radius: 18px; padding: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px" role="tablist">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
      </sc-for>
    </div>
    <div class="h-glass" style="border-radius: 24px; padding: 8px 14px; display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <a href="{{r.href}}" style="text-decoration: none; color: #1F2421; display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid rgba(0,0,0,.06)">
          <span style="{{r.gem}}" aria-hidden="true"></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 800; font-size: 16px">{{r.title}}</span><span style="font-size: 13px; color: #55605A; font-weight: 600">{{r.sub}}</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A928D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>
    <p style="margin: 0 4px; font-size: 13px; font-weight: 700; color: #FFFFFF; text-shadow: 0 1px 6px rgba(0,0,0,.3)">The stone beside each one shows the family’s highest level in it.</p>
  </div>
  <nav aria-label="Main" class="h-glass" style="position: absolute; left: 12px; right: 12px; bottom: 22px; border-radius: 26px; padding: 6px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <a href="TodayDay.dc.html" class="h-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Today</a>
    <a href="Memorize.dc.html" class="h-tab on" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"></path><path d="M2 9h20M9 3l3 18 3-18"></path></svg>Memorize</a>
    <a href="Learn.dc.html" class="h-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 0-2 2zM21 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 1 2 2z"></path></svg>Learn</a>
    <a href="Family.dc.html" class="h-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><circle cx="17" cy="9.5" r="2.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M15 20a4.5 4.5 0 0 1 7-3.7"></path></svg>Family</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { seg: 'Catechisms' }; }
  renderVals() {
    const C = { car: '#B9431F', top: '#D9A441', sap: '#2F5B9A', eme: '#2E9A6E', none: 'transparent' };
    const data = {
      Bible: [['Prayers', '12 passages · Lord’s Prayer, Psalm 51', 'top'], ['The gospel', '10 passages · John 3:16, Romans 5:8', 'sap'], ['When I’m afraid', '8 passages · Psalm 23, Isaiah 41:10', 'car'], ['Who God is', '9 passages · Exodus 34:6–7', 'none'], ['Psalms', '150 psalms, by section', 'eme'], ['Any passage', 'Search the whole Bible (ESV)', 'none']],
      Catechisms: [['Westminster Shorter', '107 questions · family is on Q6', 'eme'], ['Westminster Larger', '196 questions', 'none'], ['New City Catechism', '52 questions, with children’s answers', 'car'], ['Heidelberg', '129 questions, 52 Lord’s Days', 'none']],
      Creeds: [['Apostles’ Creed', '12 articles', 'sap'], ['Nicene Creed', 'In 4 parts', 'top'], ['Athanasian Creed', '44 verses', 'none'], ['Chalcedonian Definition', 'One paragraph', 'none']]
    };
    const seg = this.state.seg;
    return {
      segs: Object.keys(data).map((k) => ({ label: k, on: k === seg ? 'true' : 'false', pick: () => this.setState({ seg: k }), style: 'height: 42px; border-radius: 14px; border: 0; font-weight: 800; font-size: 14px; cursor: pointer; ' + (k === seg ? 'background: #2F5D50; color: #F7F4EC' : 'background: transparent; color: #1F2421') })),
      rows: data[seg].map(([title, sub, g]) => ({ title, sub, href: title === 'Westminster Shorter' ? 'Catechism.dc.html' : '#', gem: 'width: 16px; height: 16px; margin: 0 4px; border-radius: 3px; transform: rotate(45deg); flex: none; ' + (g === 'none' ? 'border: 2px solid #B9B2A2; box-sizing: border-box' : 'background: ' + C[g]) }))
    };
  }
}
</script>
</body>
</html>
