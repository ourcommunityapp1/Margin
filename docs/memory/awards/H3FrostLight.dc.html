<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frosted, on light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&amp;display=swap">
<style>
body{margin:0}
a{color:#16181A}a:hover{color:#000}
@keyframes h3-wash{0%,100%{transform:scale(1.6) translate(0,0)}50%{transform:scale(1.7) translate(-8px,6px)}}
@keyframes h3-sheen{0%,60%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(320%) skewX(-18deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3EEE6; color: #16181A; font-family: Inter, system-ui, sans-serif">
  <img src="/_blob/4423f54f58552653a8210bcd7aed723d" alt="" style="position: absolute; left: 0; top: 40px; width: 390px; height: 844px; filter: blur(46px) saturate(1.4); opacity: 0.38; animation: h3-wash 18s ease-in-out infinite">

  <div style="position: absolute; left: 20px; right: 20px; top: 52px; display: flex; justify-content: space-between; align-items: center">
    <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px">Good evening, Landon</span>
    <span style="width: 38px; height: 38px; border-radius: 19px; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px)">L</span>
  </div>

  <div style="position: absolute; left: 85px; top: 106px; width: 220px; height: 400px; border-radius: 110px 110px 26px 26px; overflow: hidden; background: #120E0B; box-shadow: 0 24px 50px rgba(60,40,20,0.25)">
    <div style="position: absolute; inset: 0; background-image: url(/_blob/73cfbf251d6b66f5ef2df21a5c1859b0); background-size: 367px 794px; background-position: -73px -330px"></div>
  </div>

  <a href="#" style="position: absolute; left: 28px; right: 28px; top: 452px; height: 86px; border-radius: 30px; overflow: hidden; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 22px; text-decoration: none; color: #16181A; background: linear-gradient(135deg, rgba(255,255,255,0.62), rgba(255,255,255,0.32)); border: 1px solid rgba(255,255,255,0.9); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 16px 36px rgba(60,40,20,0.18); backdrop-filter: blur(22px) saturate(1.8); -webkit-backdrop-filter: blur(22px) saturate(1.8)">
    <span style="position: absolute; top: 0; bottom: 0; left: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); animation: h3-sheen 6s 1s ease-in-out infinite"></span>
    <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 23px; font-weight: 500; line-height: 1.1">Lesson 8</span>
      <span style="font-size: 13px; font-weight: 500; color: #4E5458">Two new panes · 12 min</span>
    </span>
    <span style="width: 56px; height: 56px; border-radius: 28px; background: #16181A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
  </a>

  <div style="position: absolute; left: 28px; right: 28px; top: 570px; display: flex; flex-direction: column; gap: 10px">
    <span style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600"><span>2 days kept</span><span style="color: #6B6F72">7 of 107 panes lit</span></span>
    <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <span style="font-size: 11px; font-weight: 600; color: #8A8E91">{{d.l}}</span>
          <span style="width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; background: {{d.bg}}; border: {{d.border}}"></span>
        </span>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 28px; right: 28px; top: 668px; display: grid; grid-template-columns: repeat(4, 1fr); text-align: center">
    <sc-for list="{{counts}}" as="c" hint-placeholder-count="4">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <dc-import name="Medal" level="{{c.level}}" size="24" hint-size="24px,24px"></dc-import>
        <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; font-weight: 600; line-height: 1">{{c.n}}</span>
        <span style="font-size: 11px; font-weight: 600; color: #6B6F72">{{c.name}}</span>
      </span>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 50px; right: 50px; bottom: 18px; height: 54px; border-radius: 27px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; text-align: center; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.9); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px)">
    <a href="#" aria-current="page" style="text-decoration: none">Today</a>
    <a href="#" style="text-decoration: none; color: #6B6F72">Learn</a>
    <a href="#" style="text-decoration: none; color: #6B6F72">Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const states = ['missed', 'missed', 'missed', 'kept', 'today', 'later', 'rest'];
    const week = states.map((s, i) => ({
      l: 'MTWTFSS'[i],
      bg: s === 'kept' ? '#16181A' : s === 'today' ? '#E2A33A' : 'rgba(255,255,255,0.5)',
      border: s === 'rest' ? '1.5px dashed #B9B1A3' : s === 'kept' || s === 'today' ? 'none' : '1.5px solid #D3CBBE',
    }));
    return {
      week,
      counts: [
        { level: 'amethyst', n: 7, name: 'know' },
        { level: 'topaz', n: 0, name: 'memorized' },
        { level: 'carnelian', n: 0, name: 'mastered' },
        { level: 'emerald', n: 0, name: 'long-term' },
      ],
    };
  }
}
</script>
</body>
</html>
