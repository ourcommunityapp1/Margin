<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The ascent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&amp;display=swap">
<style>
body{margin:0}
a{color:#ECEEF0}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 1100px; position: relative; overflow: hidden; background: #11161C; color: #ECEEF0; font-family: Inter, system-ui, sans-serif">
  <img src="/_blob/614f50e7fc7c4f0f0011b5cb8eb02f67" alt="" style="position: absolute; left: -8%; top: -2%; width: 116%; height: 104%; object-fit: cover">
  <div style="position: relative; box-sizing: border-box; padding: 52px 16px 120px; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <button type="button" style="display: flex; align-items: center; gap: 6px; border: 0; background: rgba(30,37,43,0.9); border-radius: 18px; padding: 8px 12px; font: 600 14px Inter, sans-serif; color: #ECEEF0; min-height: 40px">
        Shorter
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <span style="display: flex; align-items: center; gap: 5px; font-weight: 700; background: rgba(30,37,43,0.9); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F0A789" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0"></path><path d="M12 6V3M5.6 8.6 3.5 6.5M18.4 8.6l2.1-2.1M2 18h20"></path></svg>2</span>
      <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; background: rgba(30,37,43,0.9); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <dc-import name="Medal" level="amethyst" size="18" hint-size="18px,18px"></dc-import>5</span>
      <span style="width: 40px; height: 40px; border-radius: 20px; background: rgba(30,37,43,0.9); display: flex; align-items: center; justify-content: center; font-weight: 700">L</span>
    </div>

    <section style="background: rgba(30,37,43,0.94); border-radius: 30px; padding: 22px 20px 12px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 18px">
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #A9B3BA">PART 1</span>
          <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; font-weight: 600">What to believe</span>
        </span>
        <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 600">5<span style="font-family: Inter, sans-serif; font-size: 13px; color: #A9B3BA; font-weight: 600"> / 38</span></span>
      </div>

      <ol style="list-style: none; margin: 0; padding: 0; position: relative">
        <span style="position: absolute; left: 13px; top: 14px; bottom: 26px; width: 2px; background: #333C43" aria-hidden="true"></span>
        <sc-for list="{{units}}" as="u" hint-placeholder-count="6">
          <li style="position: relative; display: flex; gap: 14px; padding-bottom: 18px; opacity: {{u.op}}">
            <span style="flex: none; width: 28px; display: flex; justify-content: center; padding-top: 2px">
              <sc-if value="{{u.done}}" hint-placeholder-val="{{ true }}">
                <span style="width: 28px; height: 28px; border-radius: 14px; background: #ECEEF0; color: #11161C; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
              </sc-if>
              <sc-if value="{{u.current}}" hint-placeholder-val="{{ false }}">
                <span style="width: 28px; height: 28px; border-radius: 14px; border: 3px solid #ECEEF0; box-sizing: border-box; background: #1E252B; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: #ECEEF0"></span></span>
              </sc-if>
              <sc-if value="{{u.later}}" hint-placeholder-val="{{ false }}">
                <span style="width: 16px; height: 16px; margin-top: 6px; border-radius: 8px; border: 2px solid #4B565E; box-sizing: border-box; background: #1E252B"></span>
              </sc-if>
              <sc-if value="{{u.milestone}}" hint-placeholder-val="{{ false }}">
                <span style="width: 18px; height: 18px; margin-top: 5px; transform: rotate(45deg); border: 2px solid #A9B3BA; box-sizing: border-box; background: #1E252B"></span>
              </sc-if>
            </span>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; align-items: center; gap: 10px; min-height: 30px">
                <span style="flex: 1; font-weight: {{u.weight}}; font-size: {{u.size}}; font-family: {{u.font}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{u.name}}</span>
                <sc-if value="{{u.done}}" hint-placeholder-val="{{ false }}">
                  <span style="display: flex; gap: 3px"><sc-for list="{{u.stones}}" as="s" hint-placeholder-count="5"><dc-import name="Medal" level="{{s}}" size="14" hint-size="14px,14px"></dc-import></sc-for></span>
                </sc-if>
              </div>
              <sc-if value="{{u.current}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; gap: 8px">
                  <sc-for list="{{u.qs}}" as="q" hint-placeholder-count="5">
                    <span style="display: flex; flex-direction: column; align-items: center; gap: 5px">
                      <sc-if value="{{q.next}}" hint-placeholder-val="{{ false }}"><span style="width: 42px; height: 42px; border-radius: 12px; border: 2.5px solid #ECEEF0; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 9px; height: 9px; border-radius: 5px; background: #ECEEF0"></span></span></sc-if>
                      <sc-if value="{{q.stone}}" hint-placeholder-val="{{ true }}"><dc-import name="Medal" level="{{q.level}}" size="42" hint-size="42px,42px"></dc-import></sc-if>
                      <span style="font-size: 11px; font-weight: 700; color: #A9B3BA">{{q.q}}</span>
                    </span>
                  </sc-for>
                </div>
                <a href="#" style="min-height: 54px; border-radius: 27px; background: #ECE8DF; color: #1D2327; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; text-decoration: none; margin-bottom: 6px">
                  <span>Lesson 8</span>
                  <span style="display: flex; align-items: center; gap: 8px">Start <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
                </a>
              </sc-if>
            </div>
          </li>
        </sc-for>
      </ol>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 14px; right: 14px; bottom: 16px; background: #1E252B; border-radius: 26px; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.3)">
    <a href="#" aria-current="page" style="min-height: 56px; border-radius: 20px; background: #2B343B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #ECEEF0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path></svg>Today</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #A9B3BA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 0-2 2zM21 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 1 2 2z"></path></svg>Learn</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #A9B3BA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M12 13v4M8 20h8M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3"></path></svg>Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { done: false, current: false, later: false, milestone: false, op: 1, weight: 500, size: '16px', font: 'Inter, sans-serif', stones: [], qs: [] };
    const stone = (q, level) => ({ q, level, stone: true, next: false });
    return {
      units: [
        { ...base, done: true, name: 'Our purpose and God’s Word', stones: ['topaz', 'amethyst', 'amethyst', 'amethyst', 'amethyst'] },
        { ...base, current: true, name: 'God’s plan and creation', weight: 600, size: '20px', font: '\'Source Serif 4\', Georgia, serif',
          qs: [stone('Q6', 'amethyst'), stone('Q7', 'amethyst'), { q: 'Q8', level: 'none', stone: false, next: true }, stone('Q9', 'none'), stone('Q10', 'none')] },
        { ...base, later: true, op: 0.55, name: 'Providence and the fall' },
        { ...base, later: true, op: 0.55, name: 'Sin and grace' },
        { ...base, later: true, op: 0.55, name: 'The Redeemer' },
        { ...base, later: true, op: 0.4, name: '3 more units' },
        { ...base, milestone: true, op: 0.7, name: 'Part 2 · The duty God requires', weight: 600 },
      ],
    };
  }
}
</script>
</body>
</html>
