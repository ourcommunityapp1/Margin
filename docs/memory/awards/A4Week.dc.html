<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The week and the work</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2327}a:hover{color:#000}
@keyframes hr-draw{from{stroke-dasharray:0 100}}
@keyframes hr-today{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
@keyframes hr-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #DCD4C3; color: #1D2327; font-family: Inter, system-ui, sans-serif">
  <img src="/_blob/d6716bc46934f152a7ed5964720d68df" alt="" style="position: absolute; left: -8%; top: -2%; width: 116%; height: 104%; object-fit: cover">
  <div style="position: relative; box-sizing: border-box; padding: 52px 16px 120px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <button type="button" style="display: flex; align-items: center; gap: 6px; border: 0; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 8px 12px; font: 600 14px Inter, sans-serif; color: #1D2327; min-height: 40px">Shorter
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <span style="flex: 1"></span>
      <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <dc-import name="Medal" level="amethyst" size="18" hint-size="18px,18px"></dc-import>5</span>
      <span style="width: 40px; height: 40px; border-radius: 20px; background: rgba(247,245,240,0.9); display: flex; align-items: center; justify-content: center; font-weight: 700">L</span>
    </div>

    <section style="background: #F7F5F0; border-radius: 36px; padding: 22px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 16px 40px rgba(20,24,28,0.1)">
      <div style="position: relative; width: 320px; height: 320px">
        <svg width="320" height="320" viewBox="0 0 320 320" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <circle cx="160" cy="160" r="148" pathLength="100" fill="none" stroke="{{d.color}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{d.dash}}" stroke-dashoffset="{{d.offset}}" style="animation: {{d.anim}}"></circle>
          </sc-for>
          <sc-for list="{{arcs}}" as="a" hint-placeholder-count="8">
            <circle cx="160" cy="160" r="118" pathLength="100" fill="none" stroke="#ECE8DF" stroke-width="{{a.width}}" stroke-linecap="round" stroke-dasharray="{{a.track}}" stroke-dashoffset="{{a.offset}}"></circle>
            <circle cx="160" cy="160" r="118" pathLength="100" fill="none" stroke="{{a.color}}" stroke-width="{{a.width}}" stroke-linecap="round" stroke-dasharray="{{a.fill}}" stroke-dashoffset="{{a.offset}}" style="animation: hr-draw 1.3s cubic-bezier(.2,.7,.2,1) {{a.delay}} both"></circle>
          </sc-for>
        </svg>
        <sc-for list="{{labels}}" as="l" hint-placeholder-count="7">
          <span style="position: absolute; left: {{l.x}}; top: {{l.y}}; width: 20px; height: 20px; margin: -10px 0 0 -10px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: {{l.ink}}; background: #F7F5F0; border-radius: 10px">{{l.d}}</span>
        </sc-for>
        <div style="position: absolute; inset: 72px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; animation: hr-rise 1s .8s ease-out both">
          <span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 44px; font-weight: 300; line-height: 1">2</span><span style="font-size: 13px; font-weight: 600; color: #5B6469">days kept</span></span>
          <span style="width: 44px; height: 1px; background: #D6CFC2"></span>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: #7B52B5">UNIT 2 OF 8</span>
          <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 500; line-height: 1.15">God’s plan and creation</span>
        </div>
      </div>
      <a href="#" style="align-self: stretch; min-height: 60px; border-radius: 30px; background: #1D2327; color: #F7F5F0; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
        Keep today · Lesson 8
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </section>
    <p style="margin: 0 8px; text-align: center; font-size: 13px; color: #2E3439">Outer ring: this week, Sunday at rest. Inner ring: Part 1, unit by unit.</p>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 14px; right: 14px; bottom: 16px; background: #F7F5F0; border-radius: 26px; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; box-shadow: 0 8px 24px rgba(20,24,28,0.12)">
    <a href="#" aria-current="page" style="min-height: 56px; border-radius: 20px; background: #ECE8DF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #1D2327">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path></svg>Today</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #5B6469">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 0-2 2zM21 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 1 2 2z"></path></svg>Learn</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #5B6469">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M12 13v4M8 20h8M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3"></path></svg>Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // Outer ring: Monday to Sunday. Thursday kept, Friday (today) kept and glowing, Sunday a dashed rest.
    const state = ['missed', 'missed', 'missed', 'kept', 'today', 'later', 'rest'];
    const seg = 100 / 7, g = 2.2;
    const days = state.map((s, i) => ({
      color: s === 'kept' ? '#1D2327' : s === 'today' ? '#B0442A' : s === 'rest' ? '#C9C2B5' : '#E6E0D5',
      dash: s === 'rest' ? `1.2 1.4` : `${seg - g} 100`,
      offset: `${-(i * seg + g / 2)}`,
      anim: s === 'today' ? 'hr-today 2.4s ease-in-out infinite' : 'none',
    }));
    const labels = state.map((s, i) => {
      const a = ((i + 0.5) / 7) * 2 * Math.PI - Math.PI / 2;
      return { d: 'MTWTFSS'[i], x: `${160 + 148 * Math.cos(a)}px`, y: `${160 + 148 * Math.sin(a)}px`, ink: s === 'today' ? '#B0442A' : s === 'kept' ? '#1D2327' : '#9AA0A4' };
    });
    // Sunday is a rest: a run of small dots inside its span instead of a solid stroke.
    days.pop();
    for (let k = 0; k < 6; k++) days.push({ color: '#B9B1A3', dash: '0.01 100', offset: `${-(6 * seg + g / 2 + 0.6 + k * ((seg - g - 1.2) / 5))}`, anim: 'none' });
    const sizes = [5, 5, 5, 5, 5, 5, 4, 4], known = [5, 2, 0, 0, 0, 0, 0, 0];
    const gap = 3, usable = 100 - gap * sizes.length;
    let at = gap / 2;
    const arcs = sizes.map((n, i) => {
      const len = (n / 38) * usable;
      const a = { width: i === 1 ? 14 : 9, color: i === 0 ? '#1D2327' : '#7B52B5', track: `${len} 100`, fill: `${(known[i] / n) * len} 100`, offset: `${-at}`, delay: `${0.2 + i * 0.1}s` };
      at += len + gap;
      return a;
    });
    return { days, labels, arcs };
  }
}
</script>
</body>
</html>
