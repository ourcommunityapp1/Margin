<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // The arc from Q1 (left) to the morning star (right) is the whole catechism. Part 1's units sit
    // on its first third; learned light is drawn over them and blurred into a glow.
    const sizes = [5, 5, 5, 5, 5, 5, 4, 4], known = [5, 2, 0, 0, 0, 0, 0, 0];
    const share = 38 / 107 * 100, gap = 0.8, usable = share - gap * sizes.length;
    let at = gap / 2;
    const units = [];
    sizes.forEach((n, i) => {
      const len = (n / 38) * usable, lit = (known[i] / n) * len;
      units.push({ color: 'rgba(198,203,224,0.35)', width: 5, dash: `${len} 100`, offset: `${-at}`, delay: '0s' });
      if (lit) units.push({ color: i === 0 ? '#FFFFFF' : '#C9B3F4', width: 7, dash: `${lit} 100`, offset: `${-at}`, delay: `${0.6 + i * 0.4}s` });
      at += len + gap;
    });
    const litLen = (sizes[0] / 38) * usable + gap + (known[1] / sizes[1]) * ((sizes[1] / 38) * usable);
    // Where "you" are on the arc: angle from 180deg (left) toward 0deg (right).
    const t = (gap / 2 + litLen) / 100, ang = Math.PI - t * Math.PI;
    const x = 179 + 160 * Math.cos(ang), y = 300 - 160 * Math.sin(ang);
    return { units, lit: `${gap / 2 + litLen} 100`, here: { x, y, lx: `${x + 10}px`, ly: `${y - 22}px` } };
  }
}
</script>
