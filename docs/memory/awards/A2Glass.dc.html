<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // Each unit is a pane in its own jewel color: full glass when learned, faint glass still to come.
    const jewels = ['#8E5FD0', '#E3A93A', '#C2492D', '#23A066', '#3A6FC4', '#A578E0', '#E8BC55', '#D4643F'];
    const sizes = [5, 5, 5, 5, 5, 5, 4, 4], known = [5, 2, 0, 0, 0, 0, 0, 0];
    const gap = 1.6, usable = 100 - gap * sizes.length, total = 38;
    let at = gap / 2;
    const panes = [];
    sizes.forEach((n, i) => {
      const len = (n / total) * usable, lit = (known[i] / n) * len;
      if (lit > 0) panes.push({ color: jewels[i], alpha: 1, dash: `${lit} 100`, offset: `${-at}` });
      if (len - lit > 0) panes.push({ color: jewels[i], alpha: i === 1 ? 0.35 : 0.16, dash: `${len - lit - (lit > 0 ? 0.6 : 0)} 100`, offset: `${-(at + lit + (lit > 0 ? 0.6 : 0))}` });
      at += len + gap;
    });
    return { panes };
  }
}
</script>
