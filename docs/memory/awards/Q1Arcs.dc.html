<body>

body{margin:0}
a{color:#1D2327}a:hover{color:#000}
</style>

<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #DCD4C3; color: #1D2327; font-family: Inter, system-ui, sans-serif">
  <img src="/_blob/d6716bc46934f152a7ed5964720d68df" alt="" style="position: absolute; left: -8%; top: -2%; width: 116%; height: 104%; object-fit: cover">
  <div style="position: relative; box-sizing: border-box; padding: 52px 16px 120px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <button type="button" style="display: flex; align-items: center; gap: 6px; border: 0; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 8px 12px; font: 600 14px Inter, sans-serif; color: #1D2327; min-height: 40px">
        Shorter
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <span style="display: flex; align-items: center; gap: 5px; font-weight: 700; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0442A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0"></path><path d="M12 6V3M5.6 8.6 3.5 6.5M18.4 8.6l2.1-2.1M2 18h20"></path></svg>2</span>
      <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <dc-import name="Medal" level="amethyst" size="18" hint-size="18px,18px"></dc-import>5</span>
      <span style="width: 40px; height: 40px; border-radius: 20px; background: rgba(247,245,240,0.9); display: flex; align-items: center; justify-content: center; font-weight: 700">L</span>
    </div>

    <section style="background: #F7F5F0; border-radius: 34px; padding: 26px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px; box-shadow: 0 12px 32px rgba(20,24,28,0.08)">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.6px; color: #5B6469">PART 1 · WHAT TO BELIEVE</span>
      <div style="position: relative; width: 260px; height: 260px">
        <svg width="260" height="260" viewBox="0 0 260 260" aria-hidden="true" style="transform: rotate(-90deg)">
          <sc-for list="{{arcs}}" as="a" hint-placeholder-count="8">
            <circle cx="130" cy="130" r="112" fill="none" stroke="{{a.track}}" stroke-width="{{a.width}}" stroke-linecap="round" stroke-dasharray="{{a.trackDash}}" stroke-dashoffset="{{a.offset}}"></circle>
            <circle cx="130" cy="130" r="112" fill="none" stroke="{{a.fill}}" stroke-width="{{a.width}}" stroke-linecap="round" stroke-dasharray="{{a.fillDash}}" stroke-dashoffset="{{a.offset}}"></circle>
          </sc-for>
        </svg>
        <div style="position: absolute; inset: 34px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #7B52B5">UNIT 2 OF 8</span>
          <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 600; line-height: 1.15">God’s plan and creation</span>
          <span style="display: flex; gap: 5px">
            <sc-for list="{{unit}}" as="s" hint-placeholder-count="5"><dc-import name="Medal" level="{{s}}" size="20" hint-size="20px,20px"></dc-import></sc-for>
          </span>
        </div>
      </div>
      <a href="#" style="align-self: stretch; min-height: 60px; border-radius: 30px; background: #1D2327; color: #F7F5F0; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
        Start lesson 8
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </section>

    <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{counts}}" as="c" hint-placeholder-count="3">
        <div style="background: rgba(247,245,240,0.88); border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
          <dc-import name="Medal" level="{{c.level}}" size="26" hint-size="26px,26px"></dc-import>
          <span style="display: flex; flex-direction: column">
            <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 600; line-height: 1">{{c.n}}</span>
            <span style="font-size: 11px; font-weight: 600; color: #5B6469">{{c.name}}</span>
          </span>
        </div>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 14px; right: 14px; bottom: 16px; background: #F7F5F0; border-radius: 26px; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; box-shadow: 0 8px 24px rgba(20,24,28,0.12)">
    <a href="#" aria-current="page" style="min-height: 56px; border-radius: 20px; background: #ECE8DF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #1D2327">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path></svg>Today</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #5B6469">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 0-2 2zM21 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 1 2 2z"></path></svg>Learn</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #5B6469">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M12 13v4M8 20h8M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3"></path></svg>Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // Part 1's eight units around the ring, each arc sized to its questions; gaps between units.
    const C = 2 * Math.PI * 112, gap = 14;
    const sizes = [5, 5, 5, 5, 5, 5, 4, 4];
    const known = [5, 2, 0, 0, 0, 0, 0, 0];
    const total = sizes.reduce((a, b) => a + b, 0);
    const usable = C - gap * sizes.length;
    let at = gap / 2;
    const arcs = sizes.map((n, i) => {
      const len = (n / total) * usable;
      const done = i === 0, current = i === 1;
      const fillLen = (known[i] / n) * len;
      const a = {
        width: current ? 16 : 10,
        track: current ? '#E4DCEF' : '#ECE8DF',
        fill: done ? '#1D2327' : '#7B52B5',
        trackDash: `${Math.max(0.1, len - 10)} ${C}`,
        fillDash: `${Math.max(0, fillLen - 10)} ${C}`,
        offset: `${-(at + 5)}`,
      };
      at += len + gap;
      return a;
    });
    return {
      arcs,
      unit: ['amethyst', 'amethyst', 'none', 'none', 'none'],
      counts: [
        { level: 'amethyst', n: 5, name: 'Know' },
        { level: 'topaz', n: 1, name: 'Memorized' },
        { level: 'carnelian', n: 0, name: 'Mastered' },
      ],
    };
  }
}
</script>
</body>
</html>
