<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two rings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2327}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 1100px; position: relative; overflow: hidden; background: #CDBFA9; color: #1D2327; font-family: Inter, system-ui, sans-serif">
  <img src="/_blob/c00f12d584b6a1d23de811e119ab6941" alt="" style="position: absolute; left: -8%; top: -2%; width: 116%; height: 104%; object-fit: cover">
  <div style="position: relative; box-sizing: border-box; padding: 52px 16px 120px; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <button type="button" style="display: flex; align-items: center; gap: 6px; border: 0; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 8px 12px; font: 600 14px Inter, sans-serif; color: #1D2327; min-height: 40px">
        Shorter
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <span style="display: flex; align-items: center; gap: 5px; font-weight: 700; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0442A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0"></path><path d="M12 6V3M5.6 8.6 3.5 6.5M18.4 8.6l2.1-2.1M2 18h20"></path></svg>2</span>
      <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <dc-import name="Medal" level="amethyst" size="18" hint-size="18px,18px"></dc-import>5</span>
      <span style="width: 40px; height: 40px; border-radius: 20px; background: rgba(247,245,240,0.9); display: flex; align-items: center; justify-content: center; font-weight: 700">L</span>
    </div>

    <section style="background: #F7F5F0; border-radius: 28px; padding: 20px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="position: relative; width: 120px; height: 120px">
          <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true" style="transform: rotate(-90deg)">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#ECE8DF" stroke-width="10"></circle>
            <sc-for list="{{segs}}" as="s" hint-placeholder-count="2"><circle cx="60" cy="60" r="50" fill="none" stroke="{{s.color}}" stroke-width="10" stroke-dasharray="{{s.dash}}" stroke-dashoffset="{{s.offset}}"></circle></sc-for>
          </svg>
          <span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1">5</span><span style="font-size: 12px; color: #5B6469; font-weight: 600">of 38</span></span>
        </div>
        <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 600">Believe</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0.5">
        <div style="position: relative; width: 120px; height: 120px">
          <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="#ECE8DF" stroke-width="10"></circle></svg>
          <span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1">0</span><span style="font-size: 12px; color: #5B6469; font-weight: 600">of 69</span></span>
        </div>
        <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 600">Duty</span>
      </div>
    </section>

    <section style="background: #F7F5F0; border-radius: 28px; padding: 22px 20px; display: flex; flex-direction: column; gap: 18px">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #5B6469">UNIT 2</span>
        <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; font-weight: 600; line-height: 1.1">God’s plan and creation</span>
      </span>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{qs}}" as="q" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <sc-if value="{{q.next}}" hint-placeholder-val="{{ false }}">
              <span style="width: 54px; height: 54px; border-radius: 15px; border: 2.5px solid #1D2327; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: #1D2327"></span></span>
            </sc-if>
            <sc-if value="{{q.stone}}" hint-placeholder-val="{{ true }}">
              <dc-import name="Medal" level="{{q.level}}" size="54" hint-size="54px,54px"></dc-import>
            </sc-if>
            <span style="font-size: 12px; font-weight: 700; color: {{q.ink}}">{{q.q}}</span>
          </div>
        </sc-for>
      </div>
      <a href="#" style="min-height: 58px; border-radius: 29px; background: #1D2327; color: #F7F5F0; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; text-decoration: none">
        <span>Lesson 8</span>
        <span style="display: flex; align-items: center; gap: 8px">Start <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </a>
    </section>

    <section style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px" aria-label="Part 1 units">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
        <div style="aspect-ratio: 1; border-radius: 18px; background: {{t.bg}}; border: {{t.border}}; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; opacity: {{t.op}}">
          <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 600">{{t.n}}</span>
          <span style="display: flex; gap: 2px">
            <sc-for list="{{t.bar}}" as="b" hint-placeholder-count="5"><span style="flex: 1; height: 6px; border-radius: 3px; background: {{b}}"></span></sc-for>
          </span>
        </div>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 14px; right: 14px; bottom: 16px; background: #F7F5F0; border-radius: 26px; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; box-shadow: 0 8px 24px rgba(20,24,28,0.12)">
    <a href="#" aria-current="page" style="min-height: 56px; border-radius: 20px; background: #ECE8DF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #1D2327">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path></svg>Today</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #5B6469">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 0-2 2zM21 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 1 2 2z"></path></svg>Learn</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #5B6469">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M12 13v4M8 20h8M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3"></path></svg>Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const C = 2 * Math.PI * 50, total = 38;
    let at = 0;
    const segs = [{ color: '#D99A2B', n: 1 }, { color: '#7B52B5', n: 4 }].map((p) => {
      const len = (p.n / total) * C;
      const s = { color: p.color, dash: `${len - 1.5} ${C}`, offset: `${-at}` };
      at += len;
      return s;
    });
    const stone = (q, level) => ({ q, level, stone: true, next: false, ink: '#4A5257' });
    const A = '#7B52B5', T = '#D99A2B', E = '#E3DFD6';
    const tile = (n, bar, kind) => ({
      n, bar,
      bg: kind === 'done' ? '#F7F5F0' : kind === 'current' ? '#F7F5F0' : 'rgba(247,245,240,0.55)',
      border: kind === 'current' ? '2.5px solid #1D2327' : '0',
      op: kind === 'later' ? 0.75 : 1,
    });
    return {
      segs,
      qs: [stone('Q6', 'amethyst'), stone('Q7', 'amethyst'), { q: 'Q8', level: 'none', stone: false, next: true, ink: '#1D2327' }, stone('Q9', 'none'), stone('Q10', 'none')],
      tiles: [
        tile(1, [T, A, A, A, A], 'done'),
        tile(2, [A, A, E, E, E], 'current'),
        tile(3, [E, E, E, E, E], 'later'), tile(4, [E, E, E, E, E], 'later'),
        tile(5, [E, E, E, E, E], 'later'), tile(6, [E, E, E, E, E], 'later'),
        tile(7, [E, E, E, E, E], 'later'), tile(8, [E, E, E], 'later'),
      ],
    };
  }
}
</script>
</body>
</html>
