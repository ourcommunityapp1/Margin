@keyframes hr-glow{0%,100%{filter:drop-shadow(0 0 2px rgba(150,240,200,.5))}50%{filter:drop-shadow(0 0 7px rgba(150,240,200,.95))}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // 38 ticks round the ring, one per question, with a small gap between units.
    const sizes = [5, 5, 5, 5, 5, 5, 4, 4], knownCount = 5, nextQ = 5;
    const slots = 38 + sizes.length * 0.8;
    const ticks = [];
    let pos = 0.4, q = 0;
    sizes.forEach((n, u) => {
      for (let k = 0; k < n; k++, q++, pos++) {
        const known = q < knownCount, next = q === nextQ, inUnit = u === 1;
        ticks.push({
          angle: (pos / slots) * 360,
          y: known ? 8 : 14, h: known ? 30 : next ? 24 : 18,
          fill: known ? (q === 0 ? '#F7DA97' : '#8FF0C8') : next ? '#D6BDF7' : inUnit ? 'rgba(214,189,247,0.35)' : 'rgba(236,238,240,0.16)',
          anim: known ? `hr-tick .7s ${0.3 + q * 0.12}s ease-out both, hr-glow 3.2s ${q * 0.3}s ease-in-out infinite` : next ? 'hr-blink 1.8s ease-in-out infinite' : 'none',
        });
      }
      pos += 0.8;
    });
    return { ticks };
  }
}
</script>
