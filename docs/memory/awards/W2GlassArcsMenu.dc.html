<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #DCD4C3; color: #1D2327; font-family: Inter, system-ui, sans-serif">
  <img src="/_blob/d6716bc46934f152a7ed5964720d68df" alt="" style="position: absolute; left: -8%; top: -2%; width: 116%; height: 104%; object-fit: cover">
  <div style="position: relative; box-sizing: border-box; padding: 52px 16px 120px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <button type="button" style="display: flex; align-items: center; gap: 6px; border: 0; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 8px 12px; font: 600 14px Inter, sans-serif; color: #1D2327; min-height: 40px">Shorter
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <span style="flex: 1"></span>
      <span style="display: flex; align-items: center; gap: 5px; font-weight: 700; background: rgba(247,245,240,0.9); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0442A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0"></path><path d="M12 6V3M5.6 8.6 3.5 6.5M18.4 8.6l2.1-2.1M2 18h20"></path></svg>2</span>
      <button type="button" aria-label="Menu" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: rgba(247,245,240,0.9); color: #1D2327; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
    </div>

    <section style="background: #15181B; color: #F4EFE6; border-radius: 36px; padding: 24px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px; box-shadow: 0 24px 50px rgba(20,24,28,0.35)">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 2.4px; color: #A9A196">PART 1 · WHAT TO BELIEVE</span>
      <div style="position: relative; width: 320px; height: 320px">
        <svg width="320" height="320" viewBox="0 0 320 320" aria-hidden="true" style="position: absolute; inset: 0">
          <defs>
            <filter id="w1-glass" x="0" y="0" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="7" result="n"></feTurbulence>
              <feColorMatrix in="n" type="saturate" values="0" result="g"></feColorMatrix>
              <feComponentTransfer in="g" result="g2"><feFuncR type="linear" slope="0.9" intercept="0.45"></feFuncR><feFuncG type="linear" slope="0.9" intercept="0.45"></feFuncG><feFuncB type="linear" slope="0.9" intercept="0.45"></feFuncB></feComponentTransfer>
              <feBlend in="SourceGraphic" in2="g2" mode="multiply" result="m"></feBlend>
              <feComposite in="m" in2="SourceGraphic" operator="in"></feComposite>
            </filter>
            <radialGradient id="w1-sheen" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"></stop><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></radialGradient>
            <pattern id="w1-quarry" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45 160 160)"><rect width="22" height="22" fill="#20262B"></rect><path d="M0 0H22V22" fill="none" stroke="#0B0D0F" stroke-width="2"></path></pattern>
          </defs>
          <circle cx="160" cy="160" r="102" fill="url(#w1-quarry)" filter="url(#w1-glass)" opacity="0.9"></circle>
          <circle cx="160" cy="160" r="102" fill="url(#w1-sheen)"></circle>
          <g filter="url(#w1-glass)">
            <sc-for list="{{panes}}" as="p" hint-placeholder-count="38">
              <path d="{{p.d}}" fill="{{p.fill}}"></path>
            </sc-for>
          </g>
          <sc-for list="{{panes}}" as="p" hint-placeholder-count="38">
            <path d="{{p.d}}" fill="{{p.glow}}" style="animation: {{p.anim}}"></path>
          </sc-for>
          <sc-for list="{{panes}}" as="p" hint-placeholder-count="38">
            <path d="{{p.d}}" fill="none" stroke="#0B0D0F" stroke-width="{{p.lead}}" stroke-linejoin="round"></path>
          </sc-for>
          <circle cx="160" cy="160" r="152" fill="none" stroke="#0B0D0F" stroke-width="6"></circle>
          <circle cx="160" cy="160" r="104" fill="none" stroke="#0B0D0F" stroke-width="5"></circle>
          <circle cx="160" cy="160" r="152" fill="none" stroke="rgba(255,236,200,0.18)" stroke-width="1"></circle>
          <g style="transform-origin: 160px 160px; animation: w1-sweep 9s ease-in-out infinite">
            <path d="M160 160 L160 6 A154 154 0 0 1 238 27 Z" fill="url(#w1-sheen)" opacity="0.6"></path>
          </g>
        </svg>
        <div style="position: absolute; inset: 86px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; animation: w1-rise 1s .3s ease-out both">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #F1C46B; text-shadow: 0 1px 8px rgba(0,0,0,0.8)">UNIT 2 OF 8</span>
          <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; font-weight: 500; line-height: 1.12; text-shadow: 0 1px 10px rgba(0,0,0,0.9)">God’s plan and creation</span>
          <span style="font-size: 12px; color: #C9C1B3; text-shadow: 0 1px 8px rgba(0,0,0,0.8)">2 of 5 set</span>
        </div>
      </div>
      <a href="#" style="align-self: stretch; min-height: 58px; border-radius: 29px; background: #F4EFE6; color: #15181B; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
        Start lesson 8
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>

    <p style="margin: 0 8px; text-align: center; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; line-height: 1.5; color: #2E3439">Every question you learn becomes a pane of light.</p>
  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // 38 leaded panes, one per question, in eight units. Each unit has its own jewel colour; every pane
    // varies a little, as hand-made glass does. Lit panes glow, the rest stay dark; the next one pulses.
    const sizes = [5, 5, 5, 5, 5, 5, 4, 4], known = [5, 2, 0, 0, 0, 0, 0, 0];
    const jewels = [[46, 82, 168], [176, 40, 50], [226, 160, 52], [34, 128, 84], [118, 70, 170], [214, 112, 44], [40, 112, 170], [178, 54, 82]];
    const cx = 160, cy = 160, R = 150, r = 106, gapUnit = 0.05;
    const total = 38, span = 2 * Math.PI - gapUnit * sizes.length;
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pt = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
    const panes = [];
    let a = -Math.PI / 2 + gapUnit / 2;
    sizes.forEach((n, u) => {
      for (let k = 0; k < n; k++) {
        const w = span / total, a0 = a, a1 = a + w;
        // Each question's pane is split into an outer and inner piece, like real leading.
        const mid = r + (R - r) * (0.48 + (rnd() - 0.5) * 0.18);
        const lit = k < known[u], next = !lit && k === known[u] && (u === 0 || known[u - 1] === sizes[u - 1]);
        for (const [ro, ri] of [[R, mid], [mid, r]]) {
          const j = 0.82 + rnd() * 0.36;
          const [cr, cg, cb] = jewels[u].map((c) => Math.min(255, Math.round(c * j)));
          const fill = lit ? `rgb(${cr},${cg},${cb})` : `rgb(${Math.round(cr * 0.16 + 18)},${Math.round(cg * 0.16 + 20)},${Math.round(cb * 0.16 + 24)})`;
          panes.push({
            d: `M${pt(ro, a0)} A${ro} ${ro} 0 0 1 ${pt(ro, a1)} L${pt(ri, a1)} A${ri} ${ri} 0 0 0 ${pt(ri, a0)} Z`,
            fill,
            glow: next ? `rgba(${cr},${cg},${cb},0.55)` : lit ? 'rgba(255,240,210,0.07)' : 'transparent',
            anim: next ? 'w1-next 2.4s ease-in-out infinite' : 'none',
            lead: 3.2,
          });
        }
        a = a1;
      }
      a += gapUnit;
    });
    return { panes };
  }
}
</script>
