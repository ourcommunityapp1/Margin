<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lancets, tracery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&amp;display=swap">
<style>
body{margin:0}
a{color:#FFF6E6}a:hover{color:#FFFFFF}
@keyframes l2-draw{from{stroke-dasharray:0 100}to{stroke-dasharray:100 100}}
@keyframes l2-breathe{0%,100%{box-shadow:0 0 0 1.5px #E9B867, 0 0 24px rgba(233,184,103,0.25)}50%{box-shadow:0 0 0 1.5px #E9B867, 0 0 46px rgba(233,184,103,0.55)}}
@keyframes l2-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(110% 60% at 50% 36%, #231A13, #0D0907); color: #FFF6E6; font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; left: 22px; right: 22px; top: 52px; display: flex; justify-content: space-between; align-items: center">
    <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 20px">Good evening, Landon</span>
    <span style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid rgba(255,246,230,0.28); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">L</span>
  </div>

  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
    <path d="M30 548 V300 Q30 180 195 104 Q360 180 360 300 V548" pathLength="100" fill="none" stroke="#C9A063" stroke-width="1.2" opacity="0.75" style="animation: l2-draw 2.2s cubic-bezier(.3,.7,.2,1) both"></path>
    <path d="M38 548 V302 Q38 188 195 114 Q352 188 352 302 V548" pathLength="100" fill="none" stroke="#C9A063" stroke-width="0.6" opacity="0.45" style="animation: l2-draw 2.4s .15s cubic-bezier(.3,.7,.2,1) both"></path>
    <circle cx="195" cy="178" r="34" fill="none" stroke="#C9A063" stroke-width="1.2" opacity="0.75"></circle>
    <circle cx="195" cy="178" r="28" fill="none" stroke="rgba(255,246,230,0.12)" stroke-width="3"></circle>
    <circle cx="195" cy="178" r="28" pathLength="100" fill="none" stroke="#E9B867" stroke-width="3" stroke-linecap="round" stroke-dasharray="6.5 100" transform="rotate(-90 195 178)"></circle>
  </svg>
  <span style="position: absolute; left: 161px; top: 158px; width: 68px; text-align: center; display: flex; flex-direction: column; animation: l2-fade 1s 1.2s both">
    <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 400; line-height: 1">7</span>
    <span style="font-size: 9px; font-weight: 700; letter-spacing: 1px; opacity: 0.6">OF 107</span>
  </span>

  <div style="position: absolute; left: 52px; top: 262px; width: 76px; height: 280px; border-radius: 38px 38px 3px 3px; overflow: hidden; border: 2.5px solid #0B0806">
    <div style="position: absolute; inset: 0; background-image: url(/_blob/4423f54f58552653a8210bcd7aed723d); background-size: 312px 675px; background-position: -62px -300px"></div>
  </div>
  <a href="#" style="position: absolute; left: 138px; top: 228px; width: 114px; height: 314px; border-radius: 57px 57px 4px 4px; overflow: hidden; border: 2.5px solid #0B0806; text-decoration: none; animation: l2-breathe 3.8s ease-in-out infinite">
    <div style="position: absolute; inset: 0; background-image: url(/_blob/4423f54f58552653a8210bcd7aed723d); background-size: 390px 844px; background-position: -138px -300px; filter: saturate(1.15) brightness(1.06)"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(180deg, rgba(11,8,6,0), rgba(11,8,6,0.88))"></div>
    <span style="position: absolute; left: 0; right: 0; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 20px">Lesson 8</span>
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #E9B867; color: #2A1A08; display: flex; align-items: center; justify-content: center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </span>
  </a>
  <div style="position: absolute; left: 262px; top: 262px; width: 76px; height: 280px; border-radius: 38px 38px 3px 3px; overflow: hidden; border: 2.5px solid #0B0806">
    <div style="position: absolute; inset: 0; background-image: url(/_blob/4616fe934452dcc5d91173366d4f58e8); background-size: 312px 675px; background-position: -173px -150px"></div>
  </div>

  <div style="position: absolute; left: 22px; right: 22px; top: 552px; height: 7px; border-radius: 2px; background: linear-gradient(180deg, #4A3C30, #241B14); box-shadow: inset 0 1px 0 rgba(255,236,210,0.16)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 618px; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <span style="font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 16px; opacity: 0.8">Two new panes tonight.</span>
    <div style="display: flex; gap: 16px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="width: 8px; height: 8px; border-radius: 4px; box-sizing: border-box; background: {{d.bg}}; border: {{d.border}}; box-shadow: {{d.glow}}"></span>
          <span style="font-size: 10px; font-weight: 600; opacity: 0.5">{{d.l}}</span>
        </span>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 20px; display: flex; justify-content: center; gap: 36px; font-size: 12px; font-weight: 600">
    <a href="#" aria-current="page" style="text-decoration: none">Today</a>
    <a href="#" style="text-decoration: none; opacity: 0.45">Learn</a>
    <a href="#" style="text-decoration: none; opacity: 0.45">Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const states = ['missed', 'missed', 'missed', 'kept', 'today', 'later', 'rest'];
    const week = states.map((s, i) => ({
      l: 'MTWTFSS'[i],
      bg: s === 'kept' ? '#E9B867' : 'transparent',
      border: s === 'rest' ? '1px dashed rgba(255,246,230,0.35)' : s === 'today' ? '1.5px solid #E9B867' : s === 'kept' ? 'none' : '1px solid rgba(255,246,230,0.25)',
      glow: s === 'kept' || s === 'today' ? '0 0 10px rgba(233,184,103,0.6)' : 'none',
    }));
    return { week };
  }
}
</script>
</body>
</html>
