      <span style="display: flex; align-items: center; gap: 5px; font-weight: 700; background: rgba(40,30,22,0.7); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFB04F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0"></path><path d="M12 6V3M5.6 8.6 3.5 6.5M18.4 8.6l2.1-2.1M2 18h20"></path></svg>2</span>
      <span style="width: 40px; height: 40px; border-radius: 20px; background: rgba(40,30,22,0.7); display: flex; align-items: center; justify-content: center; font-weight: 700">L</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 30px">
      <div style="position: relative; width: 300px; height: 300px">
        <svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)">
          <circle cx="150" cy="150" r="128" fill="none" stroke="rgba(246,231,207,0.08)" stroke-width="10"></circle>
          <sc-for list="{{arcs}}" as="a" hint-placeholder-count="8">
            <circle cx="150" cy="150" r="128" pathLength="100" fill="none" stroke="{{a.color}}" stroke-width="{{a.width}}" stroke-linecap="round" stroke-dasharray="{{a.dash}}" stroke-dashoffset="{{a.offset}}" style="filter: {{a.filter}}; animation: hr-draw 1.6s cubic-bezier(.2,.7,.2,1) {{a.delay}} both"></circle>
          </sc-for>
        </svg>
        <div style="position: absolute; left: 50%; top: 66px; width: 0; height: 0">
          <svg width="56" height="90" viewBox="0 0 56 90" aria-hidden="true" style="position: absolute; left: -28px; top: 0; transform-origin: 28px 80px; animation: hr-flame 1.9s ease-in-out infinite">
            <defs><radialGradient id="hr-flame-g" cx="50%" cy="72%" r="60%"><stop offset="0" stop-color="#FFF5DA"></stop><stop offset=".45" stop-color="#FFC060"></stop><stop offset="1" stop-color="#E06A24" stop-opacity="0"></stop></radialGradient></defs>
            <path d="M28 2C34 22 50 34 50 56a22 22 0 0 1-44 0C6 40 20 30 28 2z" fill="url(#hr-flame-g)"></path>

        </div>
        <div style="position: absolute; left: 0; right: 0; top: 168px; display: flex; flex-direction: column; align-items: center; gap: 4px; animation: hr-rise 1s 1s ease-out both">

        </div>
      </div>

      <p style="margin: 0; max-width: 300px; text-align: center; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.45; color: #F6E7CF; animation: hr-rise 1s 1.3s ease-out both">“Your word is a lamp to my feet and a light to my path.”<br><span style="font-style: normal; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #C9B596">PSALM 119:105</span></p>

  <nav aria-label="Main" style="position: absolute; left: 14px; right: 14px; bottom: 16px; background: rgba(36,27,20,0.92); border-radius: 26px; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // Unit arcs as a halo of firelight: learned light is bright, the rest a dim warm track.
    const sizes = [5, 5, 5, 5, 5, 5, 4, 4], known = [5, 2, 0, 0, 0, 0, 0, 0];
    const gap = 3, usable = 100 - gap * sizes.length;
    let at = gap / 2;
    const arcs = [];
    sizes.forEach((n, i) => {
      const len = (n / 38) * usable, lit = (known[i] / n) * len;
      arcs.push({ color: 'rgba(255,190,110,0.16)', width: 8, dash: `${len} 100`, offset: `${-at}`, filter: 'none', delay: '0s' });
      if (lit) arcs.push({ color: i === 0 ? '#FFD597' : '#FFB04F', width: i === 1 ? 12 : 8, dash: `${lit} 100`, offset: `${-at}`, filter: 'drop-shadow(0 0 6px rgba(255,170,74,0.9))', delay: `${0.4 + i * 0.4}s` });
      at += len + gap;
    });
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const embers = Array.from({ length: 10 }, () => ({ x: `${150 + rnd() * 90}px`, y: `${300 + rnd() * 120}px`, dur: `${4 + rnd() * 4}s`, delay: `${-rnd() * 8}s` }));
    return { arcs, embers };
  }
}
</script>
