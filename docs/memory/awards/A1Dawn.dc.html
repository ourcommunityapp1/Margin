<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // Eight unit arcs around a ring measured in percent (pathLength 100), drawn in one after another.
    const sizes = [5, 5, 5, 5, 5, 5, 4, 4], known = [5, 2, 0, 0, 0, 0, 0, 0];
    const gap = 3.2, usable = 100 - gap * sizes.length, total = 38;
    let at = gap / 2;
    let glow = { dash: '0 100', offset: '0' };
    const arcs = sizes.map((n, i) => {
      const len = (n / total) * usable;
      const fill = (known[i] / n) * len;
      const a = {
        width: i === 1 ? 15 : 9,
        color: i === 0 ? '#1D2327' : '#7B52B5',
        track: `${len} 100`, fill: `${fill} 100`, offset: `${-at}`,
        delay: `${0.2 + i * 0.12}s`, delay2: `${0.9 + i * 0.12}s`,
      };
      if (i === 1) glow = { dash: `${fill} 100`, offset: `${-at}` };
      at += len + gap;
      return a;
    });
    return { arcs, glow, unit: ['amethyst', 'amethyst', 'none', 'none', 'none'] };
  }
}
</script>
