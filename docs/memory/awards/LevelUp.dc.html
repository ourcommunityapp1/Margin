<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D2327}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #DCD4C3; color: #1D2327; font-family: Inter, system-ui, sans-serif">
  <img src="/_blob/d6716bc46934f152a7ed5964720d68df" alt="" style="position: absolute; left: -8%; top: -2%; width: 116%; height: 104%; object-fit: cover">
  <div style="position: relative; box-sizing: border-box; height: 844px; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #F7F5F0; border-radius: 28px; padding: 26px 22px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <span style="font-size: 14px; font-weight: 600; color: #5B6469">Lesson complete · Unit 2, lesson 1</span>
      <div style="width: 148px; height: 148px; border-radius: 74px; background: #ECE8DF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(236,232,223,0.5)">
        <dc-import name="Medal" level="silver" size="112" hint-size="112px,112px"></dc-import>
      </div>
      <h1 style="margin: 4px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.15">Q5 reached Silver</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4A5257">Said right on three different days. “Are there more Gods than one?” is now memorized.</p>
    </section>

    <section style="background: #F7F5F0; border-radius: 24px; padding: 8px 20px; display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 58px; border-top: {{r.top}}">
          <dc-import name="Medal" level="{{r.level}}" size="30" hint-size="30px,30px"></dc-import>
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
            <span style="font-weight: 600">{{r.title}}</span>
            <span style="font-size: 14px; color: #5B6469">{{r.sub}}</span>
          </span>
          <span style="font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: {{r.tagBg}}">{{r.tag}}</span>
        </div>
      </sc-for>
    </section>

    <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="background: #F7F5F0; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 600">{{s.value}}</span>
          <span style="font-size: 12px; font-weight: 600; color: #5B6469">{{s.label}}</span>
        </div>
      </sc-for>
    </section>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
      <a href="Today.dc.html" style="min-height: 56px; border-radius: 28px; background: #1D2327; color: #F7F5F0; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; text-decoration: none">Done</a>
      <a href="#" style="min-height: 48px; display: flex; align-items: center; justify-content: center; font-weight: 500; text-decoration: none; background: rgba(247,245,240,0.6); border-radius: 24px">Another lesson</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { level: 'bronze', title: 'Q6 · Bronze', sub: 'Typed in full, right the first time', tag: 'New', tagBg: '#F1DCC8', top: '0' },
        { level: 'silver', title: 'Q3 · Refreshed', sub: 'Back to full shine after a review', tag: 'Silver', tagBg: '#E3E7EA', top: '1px solid #E3DFD6' },
        { level: 'gold', title: 'Q1 · Gold', sub: 'Next: Emerald, earliest 18 February', tag: 'Steady', tagBg: '#ECE8DF', top: '1px solid #E3DFD6' },
      ],
      stats: [
        { value: '12 of 13', label: 'Right first time' },
        { value: '4 min', label: 'Time' },
        { value: '7 days', label: 'Kept, one more' },
      ],
    };
  }
}
</script>
</body>
</html>
