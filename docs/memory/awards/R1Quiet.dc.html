<style>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Twelve small foils around the rose, like the tracery of a round window.
    return { petals: Array.from({ length: 12 }, (_, i) => i * 30) };
  }
}
