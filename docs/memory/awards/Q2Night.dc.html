<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night sky</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F4F5}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 1000px; position: relative; overflow: hidden; background: #0C1117; color: #F2F4F5; font-family: Inter, system-ui, sans-serif">
  <img src="/_blob/614f50e7fc7c4f0f0011b5cb8eb02f67" alt="" style="position: absolute; left: -8%; top: -2%; width: 116%; height: 104%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: rgba(8,12,18,0.28)"></div>
  <div style="position: relative; box-sizing: border-box; height: 1000px; padding: 52px 16px 112px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
      <button type="button" style="display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); border-radius: 18px; padding: 8px 12px; font: 600 14px Inter, sans-serif; color: #F2F4F5; min-height: 40px; backdrop-filter: blur(12px)">
        Shorter
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <span style="display: flex; align-items: center; gap: 5px; font-weight: 700; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); border-radius: 18px; padding: 0 12px; min-height: 40px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F0A789" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 18a8 8 0 0 1 16 0"></path><path d="M12 6V3M5.6 8.6 3.5 6.5M18.4 8.6l2.1-2.1M2 18h20"></path></svg>2</span>
      <span style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-weight: 700">L</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 34px">
      <div style="position: relative; width: 236px; height: 236px">
        <svg width="236" height="236" viewBox="0 0 236 236" aria-hidden="true" style="transform: rotate(-90deg); filter: drop-shadow(0 0 10px rgba(205,176,242,0.45))">
          <circle cx="118" cy="118" r="104" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"></circle>
          <sc-for list="{{ticks}}" as="t" hint-placeholder-count="38">
            <circle cx="118" cy="118" r="104" fill="none" stroke="{{t.color}}" stroke-width="{{t.w}}" stroke-linecap="round" stroke-dasharray="{{t.dash}}" stroke-dashoffset="{{t.offset}}"></circle>
          </sc-for>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
          <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 76px; font-weight: 300; line-height: 1">5</span>
          <span style="font-size: 13px; letter-spacing: 1.4px; font-weight: 600; color: rgba(242,244,245,0.7)">OF 38 KNOWN</span>
        </div>
      </div>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 500">What to believe</span>
        <span style="font-size: 14px; color: rgba(242,244,245,0.65)">Part 1 · Westminster Shorter Catechism</span>
      </span>
      <a href="#" style="margin-top: 6px; min-height: 58px; width: 260px; border-radius: 29px; background: #F2F4F5; color: #11161C; font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; box-shadow: 0 0 40px rgba(205,176,242,0.25)">
        Start lesson 8
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </div>

    <section style="margin-top: auto; border: 1px solid rgba(255,255,255,0.14); background: rgba(20,26,33,0.55); backdrop-filter: blur(16px); border-radius: 26px; padding: 6px 18px">
      <sc-for list="{{units}}" as="u" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-top: {{u.line}}; opacity: {{u.op}}">
          <span style="width: 18px; font-size: 13px; font-weight: 700; color: rgba(242,244,245,0.55)">{{u.n}}</span>
          <span style="flex: 1; font-weight: {{u.weight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{u.name}}</span>
          <span style="display: flex; gap: 3px"><sc-for list="{{u.stones}}" as="s" hint-placeholder-count="5"><dc-import name="Medal" level="{{s}}" size="14" hint-size="14px,14px"></dc-import></sc-for></span>
        </div>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 14px; right: 14px; bottom: 16px; border: 1px solid rgba(255,255,255,0.14); background: rgba(20,26,33,0.7); backdrop-filter: blur(16px); border-radius: 26px; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
    <a href="#" aria-current="page" style="min-height: 56px; border-radius: 20px; background: rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: #F2F4F5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path></svg>Today</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: rgba(242,244,245,0.65)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 0-2 2zM21 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 1 2 2z"></path></svg>Learn</a>
    <a href="#" style="min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none; color: rgba(242,244,245,0.65)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M12 13v4M8 20h8M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3"></path></svg>Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // One short tick per question in Part 1: lit in its stone's color when known, faint when not yet.
    const C = 2 * Math.PI * 104, n = 38, step = C / n, tick = step * 0.5;
    const lit = ['#F5D48A', '#CDB0F2', '#CDB0F2', '#CDB0F2', '#CDB0F2'];
    const ticks = Array.from({ length: n }, (_, i) => ({
      color: lit[i] ?? (i === 5 ? 'rgba(242,244,245,0.9)' : 'rgba(255,255,255,0.22)'),
      w: i < lit.length ? 7 : i === 5 ? 6 : 4,
      dash: `${tick} ${C}`,
      offset: `${-(i * step + (step - tick) / 2)}`,
    }));
    return {
      ticks,
      units: [
        { n: 1, name: 'Our purpose and God’s Word', stones: ['topaz', 'amethyst', 'amethyst', 'amethyst', 'amethyst'], op: 1, weight: 500, line: '0' },
        { n: 2, name: 'God’s plan and creation', stones: ['amethyst', 'amethyst', 'none', 'none', 'none'], op: 1, weight: 700, line: '1px solid rgba(255,255,255,0.1)' },
        { n: 3, name: 'Providence and the fall', stones: ['none', 'none', 'none', 'none', 'none'], op: 0.5, weight: 500, line: '1px solid rgba(255,255,255,0.1)' },
      ],
    };
  }
}
</script>
</body>
</html>
