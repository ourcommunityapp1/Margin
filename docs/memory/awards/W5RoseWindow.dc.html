            </pattern>

          </defs>

            <circle cx="162" cy="162" r="110" stroke-width="4"></circle>
            <circle cx="162" cy="162" r="114" stroke-width="3"></circle>
            <circle cx="162" cy="162" r="150" stroke-width="4"></circle>
          </g>
          <circle cx="162" cy="162" r="156" fill="none" stroke="url(#w5-stone)" stroke-width="11"></circle>
          <circle cx="162" cy="162" r="161.5" fill="none" stroke="rgba(0,0,0,0.45)" stroke-width="1"></circle>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; margin-top: -4px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    // A rose window. Outer ring: 38 leaded panes, one per question. Eight petals: one per unit, lit when the
    // unit is done, half-lit and pulsing while it's under way, dark ahead. Jewels between the petals light as
    // their units finish. The centre always glows: the course has begun.
    const cx = 162, cy = 162;
    const sizes = [5, 5, 5, 5, 5, 5, 4, 4], known = [5, 2, 0, 0, 0, 0, 0, 0];
    const jewels = [[46, 82, 168], [176, 40, 50], [226, 160, 52], [34, 128, 84], [118, 70, 170], [214, 112, 44], [40, 112, 170], [178, 54, 82]];
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const P = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
    const tint = (c, j) => c.map((v) => Math.min(255, Math.round(v * j)));
    const lit = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
    const dark = (c) => `rgb(${Math.round(c[0] * 0.16 + 16)},${Math.round(c[1] * 0.16 + 18)},${Math.round(c[2] * 0.16 + 22)})`;
    const glass = [], glow = [], pulse = [];
    const add = (d, c, on, lead = 3) => { glass.push({ d, fill: on ? lit(c) : dark(c), lead }); if (on) glow.push({ d, fill: lit(c) }); };

    // Outer ring of questions.
    const R = 148, r = 116, gapUnit = 0.05, span = 2 * Math.PI - gapUnit * sizes.length;
    let a = -Math.PI / 2 + gapUnit / 2;
    sizes.forEach((n, u) => {
      for (let k = 0; k < n; k++) {
        const w = span / 38, a0 = a, a1 = a + w, on = k < known[u];
        const mid = r + (R - r) * (0.5 + (rnd() - 0.5) * 0.2);
        for (const [ro, ri] of [[R, mid], [mid, r]]) {
          const c = tint(jewels[u], 0.82 + rnd() * 0.36);
          const d = `M${P(ro, a0)} A${ro} ${ro} 0 0 1 ${P(ro, a1)} L${P(ri, a1)} A${ri} ${ri} 0 0 0 ${P(ri, a0)} Z`;
          add(d, c, on);
          if (!on && k === known[u] && known[u] > 0) pulse.push({ d, fill: `rgba(${c[0]},${c[1]},${c[2]},0.6)` });
        }
        a = a1;
      }
      a += gapUnit;
    });

    // Eight petals, two pieces each.
    for (let u = 0; u < 8; u++) {
      const t = -Math.PI / 2 + ((u + 0.5) / 8) * 2 * Math.PI;
      const done = known[u] === sizes[u], under = known[u] > 0 && !done;
      const c1 = tint(jewels[u], 1.05), c2 = tint(jewels[(u + 4) % 8], 1.0);
      const inner = `M${P(34, t - 0.3)} L${P(62, t - 0.22)} L${P(62, t + 0.22)} L${P(34, t + 0.3)} Z`;
      const outer = `M${P(62, t - 0.22)} L${P(86, t - 0.18)} Q${P(101, t - 0.15)} ${P(105, t)} Q${P(101, t + 0.15)} ${P(86, t + 0.18)} L${P(62, t + 0.22)} Z`;
      add(inner, c2, done || under, 2.6);
      add(outer, c1, done, 2.6);
      if (under) pulse.push({ d: outer, fill: `rgba(${c1[0]},${c1[1]},${c1[2]},0.6)` });
      // A jewel between this petal and the next, and a seed of gold nearer the centre.
      const tj = t + Math.PI / 8;
      const jr = 9, jx = 97;
      add(`M${P(jx, tj)} m${-jr} 0 a${jr} ${jr} 0 1 0 ${2 * jr} 0 a${jr} ${jr} 0 1 0 ${-2 * jr} 0`, tint([34, 128, 84], 1.1), done, 2.4);
      add(`M${P(47, tj)} m-3.5 0 a3.5 3.5 0 1 0 7 0 a3.5 3.5 0 1 0 -7 0`, [236, 186, 80], true, 1.6);
    }

    // The centre: a quatrefoil of gold around a ruby heart.
    for (let q = 0; q < 4; q++) {
      const tq = (q / 4) * 2 * Math.PI;
      add(`M${P(13, tq)} m-12 0 a12 12 0 1 0 24 0 a12 12 0 1 0 -24 0`, tint([232, 178, 64], 0.92 + q * 0.04), true, 2.4);
    }
    add(`M${cx} ${cy} m-9 0 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0`, [190, 42, 52], true, 2.4);
    return { glass, glow, pulse };
  }
}
</script>
