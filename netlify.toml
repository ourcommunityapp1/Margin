[build]
  # scripts/build-web.mjs puts the phone app and the library into public/ first.
  command = "npm run build"
  publish = ".next"

# katekize.com is Heir's own address (Netlify takes the first rule that matches, so these come before the root
# rule below), and www goes to the bare domain.
[[redirects]]
  from = "https://www.katekize.com/*"
  to = "https://katekize.com/:splat"
  status = 301
  force = true

# katekize.com shows the K icon, not the older Margin favicon that the shared app ships at /favicon.ico.
[[redirects]]
  from = "https://katekize.com/favicon.ico"
  to = "/heir/favicon.ico"
  status = 200
  force = true

# katekize.com's front door is a public page (search engines and AI answer engines read it); the app is at /heir.
[[redirects]]
  from = "https://katekize.com/"
  to = "/katekize"
  status = 200
  force = true

# The phone app is a static page; serve it at the root straight from the CDN
# (next.config.ts does the same for `next start`).
[[redirects]]
  from = "/"
  to = "/margin.html"
  status = 200
