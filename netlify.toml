[build]
  # scripts/build-web.mjs puts the phone app and the library into public/ first.
  command = "npm run build"
  publish = ".next"

# katekize.com is Heir's own address: its front door opens Heir (Netlify takes the first rule that matches, so
# these come before the root rule below), and www goes to the bare domain.
[[redirects]]
  from = "https://www.katekize.com/*"
  to = "https://katekize.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://katekize.com/"
  to = "/heir"
  status = 302
  force = true

# The phone app is a static page; serve it at the root straight from the CDN
# (next.config.ts does the same for `next start`).
[[redirects]]
  from = "/"
  to = "/margin.html"
  status = 200
